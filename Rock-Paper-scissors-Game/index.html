<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1><span class="heading-span">Rock</span><span class="heading-span2"> Paper</span>  Scissors</h1>
        <div class="scoreboard">
            <div id="player-section" class="player-section">
            <p>Player-Chose:</p>
            <img src="images/paper.png" alt="">
           
        </div>
        <div class="computer-section">
            <p>computer-chose:</p>
            <img src="images/scissors.png" alt="">
            
        </div>
        <div class="winner-section">
            <p>Computer-wins: <br> <span id="computer-score">0</span></p>
            <p>Player-Wins: <br> <span id="player-score">0</span></p>
        </div>
        </div>
        <div class="choices">
            <button class="choice" id="rock">✊ Rock</button>
            <button class="choice" id="paper">✋ Paper</button>
            <button class="choice" id="scissors">✌️ Scissors</button>
        </div>
       
    </div>
</body>
</html>
